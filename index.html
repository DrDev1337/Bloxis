<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120f26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bloxis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===== Huvudmeny ===== -->
    <section id="screen-menu" class="screen active">
      <div class="menu-top">
        <button id="btn-wardrobe" class="avatar-btn" aria-label="Garderob"><span id="menu-avatar"></span></button>
        <span class="coin-chip"><img class="twe" src="assets/icons/coin.svg" alt=""> <span id="menu-coins">0</span></span>
        <span class="coin-chip"><img class="twe" src="assets/icons/flame.svg" alt=""> <span id="menu-streak">0</span></span>
        <span class="menu-top-spacer"></span>
        <button id="btn-achievements" class="btn icon" aria-label="Utm&auml;rkelser"><img class="twe" src="assets/icons/medal.svg" alt=""></button>
        <button id="btn-settings" class="btn icon" aria-label="Inst&auml;llningar"><img class="twe" src="assets/icons/gear.svg" alt=""></button>
      </div>
      <div class="menu-inner">
        <h1 class="logo" aria-label="Bloxis"></h1>
        <p class="tagline" data-l="tagline">Ett förtrollat blockäventyr</p>
        <div class="menu-buttons">
          <button id="btn-endless" class="btn hero"><span class="shine"></span><span class="hero-ic">&infin;</span><span data-l="menuEndless">O&auml;ndligt l&auml;ge</span></button>
          <button id="btn-levels" class="btn row"><span class="mb-ic ic-purple"><img class="twe" src="assets/icons/puzzle.svg" alt=""></span><span class="mb-label" data-l="menuLevels">Banor</span><span class="mb-arrow">&rsaquo;</span></button>
          <button id="btn-daily" class="btn row"><span class="mb-ic ic-teal"><img class="twe" src="assets/icons/calendar.svg" alt=""></span><span class="mb-label" data-l="menuDaily">Dagens utmaning</span><span id="daily-badge" class="badge hidden">!</span><span class="mb-arrow">&rsaquo;</span></button>
          <button id="btn-quests" class="btn row"><span class="mb-ic ic-rose"><img class="twe" src="assets/icons/scroll.svg" alt=""></span><span class="mb-label" data-l="menuQuests">Veckouppdrag</span><span id="quest-badge" class="badge hidden">!</span><span class="mb-arrow">&rsaquo;</span></button>
          <button id="btn-help" class="btn ghost" data-l="menuHelp">S&aring; spelar du</button>
        </div>
        <p class="best-line"><span data-l="record">Rekord:</span> <span id="menu-best">0</span> &ensp;&bull;&ensp; <img class="twe" src="assets/icons/star.svg" alt=""> <span id="menu-stars">0</span></p>
      </div>
    </section>

    <!-- ===== Bankarta ===== -->
    <section id="screen-levels" class="screen">
      <header class="bar">
        <button class="btn icon btn-back" aria-label="Tillbaka">&#8592;</button>
        <h2>Banor</h2>
        <span class="coin-chip"><img class="twe" src="assets/icons/star.svg" alt=""> <span id="map-stars">0</span></span>
        <span class="coin-chip"><img class="twe" src="assets/icons/coin.svg" alt=""> <span id="map-coins">0</span></span>
      </header>
      <div id="level-map"></div>
    </section>

    <!-- ===== Spelskärm ===== -->
    <section id="screen-game" class="screen">
      <header class="bar">
        <button class="btn icon btn-back" aria-label="Tillbaka">&#8592;</button>
        <div id="hud-center">
          <div id="hud-score">0</div>
          <div id="hud-sub"></div>
        </div>
        <span class="coin-chip" id="game-coins-chip"><img class="twe" src="assets/icons/coin.svg" alt=""> <span id="game-coins">0</span></span>
        <button id="btn-restart" class="btn icon" aria-label="B&ouml;rja om">&#10227;</button>
      </header>
      <div id="hud-objective" class="hidden"></div>
      <div id="board-wrap">
        <canvas id="board"></canvas>
        <div id="combo-pop" class="hidden"></div>
      </div>
      <div id="tray">
        <div class="slot" data-slot="0"><canvas></canvas></div>
        <div class="slot" data-slot="1"><canvas></canvas></div>
        <div class="slot" data-slot="2"><canvas></canvas></div>
      </div>
      <div id="boosters">
        <button class="booster" data-booster="hammer"><img class="twe" src="assets/icons/hammer.svg" alt=""><span class="price">30</span></button>
        <button class="booster" data-booster="bomb"><img class="twe" src="assets/icons/bomb.svg" alt=""><span class="price">60</span></button>
        <button class="booster" data-booster="swap"><img class="twe" src="assets/icons/swap.svg" alt=""><span class="price">20</span></button>
        <button class="booster" data-booster="undo"><img class="twe" src="assets/icons/undo.svg" alt=""><span class="price">25</span></button>
      </div>
    </section>

    <!-- ===== Overlay (paus / resultat / hjälp) ===== -->
    <div id="overlay" class="hidden">
      <div class="panel">
        <h2 id="ov-title"></h2>
        <div id="ov-stars" class="hidden"></div>
        <div id="ov-text"></div>
        <div id="ov-buttons"></div>
      </div>
    </div>

    <!-- Tutorial -->
    <div id="tutor-bubble" class="hidden"><p id="tutor-text"></p></div>
    <div id="tutor-hand" class="hidden"><img src="assets/twemoji/1f446.svg" alt=""></div>

    <!-- Achievement-toast -->
    <div id="toast" class="hidden"></div>

    <!-- Flytande pjäs vid drag -->
    <canvas id="drag-piece" class="hidden"></canvas>
  </div>

  <script src="js/lang.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
