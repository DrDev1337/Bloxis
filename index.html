<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14162b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bloxis</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ===== Huvudmeny ===== -->
    <section id="screen-menu" class="screen active">
      <div class="menu-inner">
        <h1 class="logo"><span>B</span><span>L</span><span>O</span><span>X</span><span>I</span><span>S</span></h1>
        <p class="tagline">Placera block &ndash; rensa rader!</p>
        <div class="menu-buttons">
          <button id="btn-endless" class="btn big primary">&infin;&ensp;O&auml;ndligt l&auml;ge</button>
          <button id="btn-levels" class="btn big">&#129513;&ensp;Banor</button>
          <button id="btn-help" class="btn">S&aring; spelar du</button>
        </div>
        <p class="best-line">Rekord: <span id="menu-best">0</span> &ensp;&bull;&ensp; &#128176; <span id="menu-coins">0</span></p>
      </div>
    </section>

    <!-- ===== Bankarta ===== -->
    <section id="screen-levels" class="screen">
      <header class="bar">
        <button class="btn icon btn-back" aria-label="Tillbaka">&#8592;</button>
        <h2>Banor</h2>
        <span class="coin-chip">&#11088; <span id="map-stars">0</span></span>
        <span class="coin-chip">&#128176; <span id="map-coins">0</span></span>
      </header>
      <div id="level-map"></div>
    </section>

    <!-- ===== Spelskärm ===== -->
    <section id="screen-game" class="screen">
      <header class="bar">
        <button class="btn icon btn-back" aria-label="Tillbaka">&#8592;</button>
        <div id="hud-center">
          <div id="hud-score">0</div>
          <div id="hud-sub"></div>
        </div>
        <span class="coin-chip" id="game-coins-chip">&#128176; <span id="game-coins">0</span></span>
        <button id="btn-restart" class="btn icon" aria-label="B&ouml;rja om">&#10227;</button>
      </header>
      <div id="hud-objective" class="hidden"></div>
      <div id="board-wrap">
        <canvas id="board"></canvas>
        <div id="combo-pop" class="hidden"></div>
      </div>
      <div id="tray">
        <div class="slot" data-slot="0"><canvas></canvas></div>
        <div class="slot" data-slot="1"><canvas></canvas></div>
        <div class="slot" data-slot="2"><canvas></canvas></div>
      </div>
      <div id="boosters">
        <button class="booster" data-booster="hammer">&#128296;<span class="price">30</span></button>
        <button class="booster" data-booster="bomb">&#128163;<span class="price">60</span></button>
        <button class="booster" data-booster="swap">&#128260;<span class="price">20</span></button>
        <button class="booster" data-booster="undo">&#8617;&#65039;<span class="price">25</span></button>
      </div>
    </section>

    <!-- ===== Overlay (paus / resultat / hjälp) ===== -->
    <div id="overlay" class="hidden">
      <div class="panel">
        <h2 id="ov-title"></h2>
        <div id="ov-stars" class="hidden"></div>
        <div id="ov-text"></div>
        <div id="ov-buttons"></div>
      </div>
    </div>

    <!-- Flytande pjäs vid drag -->
    <canvas id="drag-piece" class="hidden"></canvas>
  </div>

  <script src="js/shapes.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
