# Publicerar Bloxis på GitHub Pages vid varje push.
# Spelet är helt statiskt, så hela repot publiceras till gh-pages-branchen,
# som GitHub Pages aktiveras automatiskt för.
name: Publicera till GitHub Pages

on:
  push:
    branches:
      - main
      - claude/block-blast-mobile-game-xgvyg5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
