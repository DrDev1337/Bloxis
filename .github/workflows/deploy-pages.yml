# Publicerar Bloxis på GitHub Pages vid varje push.
# Spelet är statiskt i repo-roten; levelmap-demon (React) byggs först och
# publiceras under /levelmap/dist/. Allt hamnar på gh-pages-branchen.
name: Publicera till GitHub Pages

on:
  push:
    branches:
      - main
      - claude/block-blast-mobile-game-xgvyg5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: levelmap/package-lock.json

      - name: Bygg levelmap-demon
        working-directory: levelmap
        run: |
          npm ci
          npm run typecheck
          npm run build

      # peaceiris respekterar .gitignore vid publicering – utan detta steg
      # filtreras levelmap/dist bort från gh-pages
      - name: Släpp igenom byggresultatet
        run: rm levelmap/.gitignore

      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,levelmap/node_modules,levelmap/src'
