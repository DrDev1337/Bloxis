# Testar och publicerar Bloxis på GitHub Pages vid varje push.
# Testjobbet gatar publiceringen: logiksmoke, banaudit och botvalidering
# körs i ren Node, därefter e2e i Chromium via Playwright.
name: Testa och publicera

on:
  push:
    branches:
      - main
      - claude/block-blast-mobile-game-xgvyg5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Logiksmoke (mekaniker)
        run: node tests/smoke-mech.js

      - name: Banaudit
        run: node tests/audit-levels.js

      - name: Botvalidering (spelbarhet)
        run: BOT_N=10 BOT_MIN=15 node tests/botval.js

      - name: Installera Playwright
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E i Chromium
        run: node tests/e2e.js

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: levelmap/package-lock.json

      - name: Bygg levelmap-demon
        working-directory: levelmap
        run: |
          npm ci
          npm run typecheck
          npm run build

      # peaceiris respekterar .gitignore vid publicering – utan detta steg
      # filtreras levelmap/dist bort från gh-pages
      - name: Släpp igenom byggresultatet
        run: rm levelmap/.gitignore

      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,levelmap/node_modules,levelmap/src,tests'
